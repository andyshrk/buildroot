image boot.vfat {
	vfat {
		files = {
			"u-boot.img",
			"u-boot.scr",
			"Image",
			"socfpga_stratix10_socdk.dtb",
			"extlinux"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "dos"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
